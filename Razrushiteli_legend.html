<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Rutube плеер — Разрушители легенд и все сезоны</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 16px;
            color: #eee;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #141414;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }
        
        .sub {
            color: #aaa;
            margin-bottom: 24px;
            padding-left: 12px;
            border-left: 3px solid #ff5e00;
            font-size: 0.9rem;
        }
        
        /* Навигация по сезонам */
        .seasons-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2c2c30;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .season-btn {
            background: #1f1f23;
            border: none;
            color: #aaa;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            font-family: inherit;
        }
        
        .season-btn.active {
            background: #ff5e00;
            color: #111;
        }
        
        /* Горизонтальный скролл для кнопок серий */
        .episodes-wrapper {
            margin-bottom: 24px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }
        
        .episodes-panel {
            display: flex;
            gap: 10px;
            padding: 4px 2px;
            min-width: min-content;
            flex-wrap: wrap;
        }
        
        .ep-btn {
            background: #2c2c2e;
            border: none;
            color: white;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }
        
        .ep-btn:active {
            transform: scale(0.96);
            background: #3a3a3c;
        }
        
        .ep-btn.active {
            background: #ff5e00;
            color: #111;
            box-shadow: 0 0 8px rgba(255,94,0,0.4);
        }
        
        /* Контейнер плеера */
        .player-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        
        .player-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .player-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
            background: #0a0a0a;
            font-size: 1rem;
        }
        
        .status {
            background: #1f1f23;
            border-radius: 16px;
            padding: 12px 16px;
            font-size: 0.85rem;
            word-break: break-word;
            border: 1px solid #2c2c30;
            text-align: center;
        }
        
        .status.loading { color: #ffb347; }
        .status.error { color: #ff6b6b; }
        .status.success { color: #6bcb6b; }
        
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .season-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ff5e00;
        }
        
        .ep-count {
            font-size: 0.8rem;
            color: #888;
        }
        
        .note {
            font-size: 0.7rem;
            text-align: center;
            color: #6c6c70;
            margin-top: 16px;
        }
        
        @media (max-width: 640px) {
            body { padding: 12px; }
            .container { padding: 16px; }
            h1 { font-size: 1.4rem; }
            .season-btn { padding: 6px 14px; font-size: 0.8rem; }
            .ep-btn { padding: 6px 12px; font-size: 0.75rem; }
        }
        
        @media (max-width: 480px) {
            .episodes-panel { gap: 6px; }
            .ep-btn { padding: 5px 10px; }
        }
    </style>
</head>

    // Группируем серии по сезонам
    function groupBySeason(data) {
        const seasons = {};
        
        for (const [id, title] of Object.entries(data)) {
            let seasonNum = null;
            
            // Определяем сезон из названия
            if (title.includes('Спецвыпуск Турбо 1 сезон')) {
                seasonNum = 1;
            } else {
                const match = title.match(/(\d+)\s*сезон/);
                if (match) {
                    seasonNum = parseInt(match[1]);
                }
            }
            
            if (seasonNum) {
                if (!seasons[seasonNum]) {
                    seasons[seasonNum] = [];
                }
                // Извлекаем номер серии
                const epMatch = title.match(/(\d+)\s*серия/);
                const epNum = epMatch ? parseInt(epMatch[1]) : 0;
                seasons[seasonNum].push({
                    id: id,
                    title: title,
                    episode: epNum
                });
            }
        }
        
        // Сортируем серии по номеру
        for (const season in seasons) {
            seasons[season].sort((a, b) => a.episode - b.episode);
        }
        
        return seasons;
    }

    const seasons = groupBySeason(seriesData);
    const sortedSeasons = Object.keys(seasons).sort((a,b) => parseInt(a) - parseInt(b));
    
    let currentSeason = null;
    let currentVideoId = null;
    
    const seasonsNav = document.getElementById('seasonsNav');
    const episodesPanel = document.getElementById('episodesPanel');
    const playerContainer = document.getElementById('playerContainer');
    const statusDiv = document.getElementById('statusMessage');
    const currentSeasonTitleSpan = document.getElementById('currentSeasonTitle');
    const epCountSpan = document.getElementById('epCount');
    
    function setStatus(text, type = 'info') {
        statusDiv.innerHTML = text;
        statusDiv.className = 'status';
        if (type === 'loading') statusDiv.classList.add('loading');
        else if (type === 'error') statusDiv.classList.add('error');
        else if (type === 'success') statusDiv.classList.add('success');
    }
    
    function getEmbedUrl(videoId) {
        return `https://rutube.ru/play/embed/${videoId}/?autoplay=1&mute=0&loop=0`;
    }
    
    function playVideo(videoId, title) {
        if (currentVideoId === videoId) {
            setStatus(`▶️ Уже воспроизводится: ${title}`, 'success');
            return;
        }
        
        setStatus(`🎬 Загрузка: ${title}...`, 'loading');
        currentVideoId = videoId;
        
        const embedUrl = getEmbedUrl(videoId);
        
        playerContainer.innerHTML = `
            <iframe 
                src="${embedUrl}"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen>
            </iframe>
        `;
        
        setStatus(`✅ Сейчас играет: ${title}`, 'success');
    }
    
    function renderEpisodes(seasonNum) {
        const seasonEpisodes = seasons[seasonNum];
        if (!seasonEpisodes) return;
        
        episodesPanel.innerHTML = '';
        
        seasonEpisodes.forEach((ep, index) => {
            const btn = document.createElement('button');
            btn.className = 'ep-btn';
            btn.textContent = `${ep.episode} серия`;
            btn.title = ep.title;
            
            btn.addEventListener('click', () => {
                document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                playVideo(ep.id, ep.title);
            });
            
            episodesPanel.appendChild(btn);
            
            // Автозапуск первой серии при смене сезона
//            if (index === 0 && currentSeason === seasonNum) {
//                setTimeout(() => {
//                    btn.click();
//                }, 100);
//            }
        });
        
        currentSeasonTitleSpan.textContent = `${seasonNum} СЕЗОН`;
        epCountSpan.textContent = `${seasonEpisodes.length} серий`;
    }
    
    function renderSeasons() {
        seasonsNav.innerHTML = '';
        
        sortedSeasons.forEach(seasonNum => {
            const btn = document.createElement('button');
            btn.className = 'season-btn';
            btn.textContent = `${seasonNum} сезон`;
            
            btn.addEventListener('click', () => {
                document.querySelectorAll('.season-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSeason = seasonNum;
                renderEpisodes(seasonNum);
            });
            
            seasonsNav.appendChild(btn);
        });
        
        // Выбираем первый сезон по умолчанию
        if (sortedSeasons.length > 0) {
            const firstSeason = sortedSeasons[0];
            const firstBtn = seasonsNav.querySelector('.season-btn');
            if (firstBtn) firstBtn.classList.add('active');
            currentSeason = firstSeason;
            renderEpisodes(firstSeason);
        }
    }
    
    renderSeasons();
