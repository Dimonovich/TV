<html lang="ru">
<head>

    <title>HDR FLAC · Радио</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0c12;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: #eef2ff;
            line-height: 1.5;
            padding: 2rem 1.5rem 5rem 1.5rem;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 10% 20%, rgba(30, 45, 80, 0.4), rgba(0, 0, 0, 0.9));
            pointer-events: none;
            z-index: -2;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .hero {
            margin-bottom: 2rem;
            text-align: center;
        }

        .hero h1 {
            font-size: 2.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FFFFFF, #B4C9FF, #9B7BFF);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            border-radius: 100px;
            padding: 0.3rem 1rem;
            font-size: 0.85rem;
            color: #bfd6ff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-top: 0.75rem;
        }

        .hero p {
            color: #9aa6c5;
            max-width: 600px;
            margin: 1rem auto 0;
            font-size: 0.95rem;
        }

        .search-section {
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
        }

        .search-box {
            background: #11161f;
            border-radius: 60px;
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
            max-width: 460px;
            border: 1px solid #2a2f3c;
        }

        .search-box input {
            background: transparent;
            border: none;
            width: 100%;
            padding: 0.7rem 0;
            font-size: 1rem;
            color: #f0f3fa;
            outline: none;
        }

        .search-box input::placeholder {
            color: #5b6685;
        }

        .categories-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid #202433;
            padding-bottom: 1rem;
            overflow-x: auto;
        }

        .cat-btn {
            background: transparent;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #b3c1e0;
            cursor: pointer;
            white-space: nowrap;
        }

        .cat-btn.active, .cat-btn:hover {
            background: #2d3b66;
            color: white;
        }

        .stations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 1.3rem;
        }

        .station-card {
            background: rgba(18, 23, 34, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 1.2rem;
            border: 1px solid rgba(72, 85, 120, 0.35);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .station-card:hover {
            transform: translateY(-4px);
            border-color: #5e7cd9;
            background: rgba(28, 35, 52, 0.85);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            margin-bottom: 0.8rem;
        }

        .logo-wrapper {
            width: 44px;
            height: 44px;
            background: #0f121b;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .station-name {
            font-weight: 700;
            font-size: 1rem;
            color: white;
        }

        .genre-tag {
            font-size: 0.7rem;
            background: rgba(85, 110, 170, 0.3);
            display: inline-block;
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            margin: 0.6rem 0 0.75rem;
            color: #b9cdff;
        }

        .play-btn {
            margin-top: 0.9rem;
            background: #21293e;
            border: none;
            border-radius: 40px;
            padding: 0.6rem 0;
            font-weight: 600;
            font-size: 0.85rem;
            color: #e2ecff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            width: 100%;
        }

        .play-btn.active-now {
            background: #4c6a9e;
            color: white;
            box-shadow: 0 0 8px rgba(100, 150, 255, 0.5);
        }

        .play-icon-animated {
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .play-icon-animated span {
            width: 4px;
            height: 12px;
            background-color: currentColor;
            border-radius: 2px;
            animation: soundWave 1.2s ease infinite alternate;
        }

        .play-icon-animated span:nth-child(1) { animation-delay: 0s; }
        .play-icon-animated span:nth-child(2) { animation-delay: 0.2s; }
        .play-icon-animated span:nth-child(3) { animation-delay: 0.4s; }
        .play-icon-animated span:nth-child(4) { animation-delay: 0.1s; }

        @keyframes soundWave {
            0% { height: 6px; opacity: 0.5; }
            100% { height: 18px; opacity: 1; }
        }

        /* Миниплеер — фиксированная структура, кнопки не прыгают */
        .now-playing {
            position: sticky;
            bottom: 1rem;
            margin-top: 2rem;
            background: rgba(10, 12, 22, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 0.6rem 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            border: 1px solid rgba(72, 85, 120, 0.4);
            z-index: 20;
            flex-wrap: nowrap;
        }

        /* Контейнер для названия с фиксированной шириной и бегущей строкой */
        .station-name-container {
            flex: 1;
            min-width: 0;
            max-width: 280px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 40px;
            padding: 0.3rem 0;
            overflow: hidden;
            position: relative;
        }

        .current-station {
            font-weight: 500;
            font-size: 0.85rem;
            color: #bdd4ff;
            white-space: nowrap;
            display: inline-block;
            padding-left: 1rem;
            padding-right: 1rem;
            animation: none;
        }

        /* Анимация бегущей строки - запускается при наведении или касании */
        .station-name-container.scrolling .current-station {
            animation: marquee 8s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Блок с кнопками — фиксированная ширина, не сжимается */
        .player-controls {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-shrink: 0;
        }

        .ctrl-btn {
            background: #1e2538;
            border: none;
            border-radius: 40px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            color: #cbd5ff;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .ctrl-btn:hover {
            background: #3c4a76;
            color: white;
        }

        .stop-btn {
            background: #2a2f44;
            border: none;
            border-radius: 40px;
            padding: 0.4rem 1.2rem;
            color: #ffb7b7;
            cursor: pointer;
            flex-shrink: 0;
            font-size: 0.85rem;
        }

        /* Мобильная версия */
        @media (max-width: 640px) {
            .now-playing {
                padding: 0.4rem 0.8rem;
                gap: 0.5rem;
            }
            .station-name-container {
                max-width: 150px;
                padding: 0.2rem 0;
            }
            .current-station {
                font-size: 0.7rem;
                padding-left: 0.8rem;
                padding-right: 0.8rem;
            }
            .ctrl-btn {
                width: 32px;
                height: 32px;
                font-size: 1rem;
            }
            .stop-btn {
                padding: 0.2rem 0.7rem;
                font-size: 0.7rem;
            }
        }

        audio {
            display: none;
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            color: #7f8db0;
            background: #0c1020;
            border-radius: 40px;
        }

        footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.7rem;
            color: #5c688b;
            border-top: 1px solid #1f253c;
            padding-top: 1.8rem;
        }
    </style>
</head>

</div>

        { group: "SHANSON", name: "RUSSIAN POST SHANSON", url: "http://79.120.77.11:8000/postshanson", logo: "https://i.postimg.cc/Pfg61r8d/dostavka-shanson-ekb.jpg" },

        { group: "SHANSON", name: "RUSSIAN ROMANCE", url: "http://79.120.77.11:8000/romanceru", logo: "https://i.postimg.cc/Pfg61r8d/dostavka-shanson-ekb.jpg" }
    ];

    // Глобальные переменные
    let activeCategory = "ALL";
    let searchQuery = "";
    let currentFilteredList = [];
    let currentIndex = -1;
    let currentActiveButton = null;
    let isPlaying = false;

    const audio = document.getElementById('audioPlayer');
    const bar = document.getElementById('nowPlayingBar');
    const stationNameSpan = document.getElementById('currentStationName');
    const stationNameContainer = document.getElementById('stationNameContainer');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevTrackBtn');
    const nextBtn = document.getElementById('nextTrackBtn');
    const stopBtn = document.getElementById('stopPlaybackBtn');

    // Функция для проверки и запуска бегущей строки
    function checkAndStartMarquee() {
        const container = stationNameContainer;
        const textSpan = stationNameSpan;
        if (!container || !textSpan) return;
        
        // Временно убираем анимацию, чтобы измерить реальную ширину
        container.classList.remove('scrolling');
        const containerWidth = container.clientWidth;
        const textWidth = textSpan.scrollWidth;
        
        // Если текст шире контейнера, включаем анимацию
        if (textWidth > containerWidth) {
            // Добавляем копию текста для бесконечной прокрутки
            const currentText = textSpan.innerText;
            // Проверяем, нет ли уже дубликата
            if (!textSpan.hasAttribute('data-duplicated')) {
                textSpan.setAttribute('data-duplicated', 'true');
                // Для бесконечной прокрутки нужно два одинаковых блока
                // Проще всего — создать дубликат через CSS, но мы сделаем через JS
                const cloneText = currentText + '   ✦   ' + currentText;
                textSpan.innerText = cloneText;
            }
            container.classList.add('scrolling');
        } else {
            container.classList.remove('scrolling');
            // Возвращаем оригинальный текст без дубликата
            const originalText = textSpan.getAttribute('data-original');
            if (originalText) {
                textSpan.innerText = originalText;
                textSpan.removeAttribute('data-duplicated');
            }
        }
    }

    // Обновление названия станции
    function updateStationName(name) {
        const displayName = `🎸 ${name}`;
        stationNameSpan.innerText = displayName;
        stationNameSpan.setAttribute('data-original', displayName);
        // Небольшая задержка для корректного измерения ширины
        setTimeout(checkAndStartMarquee, 10);
    }

    // Следим за изменением размера окна
    window.addEventListener('resize', () => {
        if (bar.style.display === 'flex') {
            checkAndStartMarquee();
        }
    });

    function updateFilteredList() {
        currentFilteredList = stationsData.filter(s => {
            const matchCategory = activeCategory === "ALL" || s.group === activeCategory;
            const matchSearch = searchQuery === "" || s.name.toLowerCase().includes(searchQuery.toLowerCase()) || s.group.toLowerCase().includes(searchQuery.toLowerCase());
            return matchCategory && matchSearch;
        });
    }

    function updateActiveButton(index) {
        if (currentActiveButton) {
            currentActiveButton.classList.remove('active-now');
            currentActiveButton.innerHTML = `▶ Воспроизвести`;
        }
        if (index >= 0 && index < currentFilteredList.length) {
            const station = currentFilteredList[index];
            const cards = document.querySelectorAll('.station-card');
            for (let card of cards) {
                if (card.dataset.url === station.url) {
                    const btn = card.querySelector('.play-btn');
                    if (btn) {
                        currentActiveButton = btn;
                        btn.classList.add('active-now');
                        btn.innerHTML = `<div class="play-icon-animated"><span></span><span></span><span></span><span></span></div> Слушаю`;
                    }
                    break;
                }
            }
        }
    }

    function playByIndex(index) {
        if (index < 0 || index >= currentFilteredList.length) return;
        const station = currentFilteredList[index];
        audio.src = station.url;
        audio.load();
        audio.play().catch(e => console.warn("Автовоспроизведение заблокировано"));
        updateStationName(station.name);
        bar.style.display = 'flex';
        currentIndex = index;
        isPlaying = true;
        playPauseBtn.textContent = '⏸';
        updateActiveButton(index);
        
        audio.onended = () => {
            if (isPlaying) nextTrack();
        };
        audio.onerror = () => {
            console.warn("Ошибка потока");
        };
    }

    function nextTrack() {
        if (currentFilteredList.length === 0) return;
        let newIndex = currentIndex + 1;
        if (newIndex >= currentFilteredList.length) newIndex = 0;
        playByIndex(newIndex);
    }

    function prevTrack() {
        if (currentFilteredList.length === 0) return;
        let newIndex = currentIndex - 1;
        if (newIndex < 0) newIndex = currentFilteredList.length - 1;
        playByIndex(newIndex);
    }

    function togglePlayPause() {
        if (currentIndex === -1) return;
        if (audio.paused) {
            audio.play();
            isPlaying = true;
            playPauseBtn.textContent = '⏸';
        } else {
            audio.pause();
            isPlaying = false;
            playPauseBtn.textContent = '▶';
        }
    }

    function stopPlayback() {
        audio.pause();
        audio.src = "";
        bar.style.display = 'none';
        if (currentActiveButton) {
            currentActiveButton.classList.remove('active-now');
            currentActiveButton.innerHTML = `▶ Воспроизвести`;
            currentActiveButton = null;
        }
        currentIndex = -1;
        isPlaying = false;
        playPauseBtn.textContent = '⏸';
    }

    prevBtn.addEventListener('click', prevTrack);
    nextBtn.addEventListener('click', nextTrack);
    playPauseBtn.addEventListener('click', togglePlayPause);
    stopBtn.addEventListener('click', stopPlayback);

    function renderStations() {
        updateFilteredList();
        const grid = document.getElementById('stationsGrid');
        if (currentFilteredList.length === 0) {
            grid.innerHTML = `<div class="no-results">🎵 Ничего не найдено</div>`;
            return;
        }
        grid.innerHTML = currentFilteredList.map((station, idx) => {
            const isActive = (currentIndex === idx && currentActiveButton !== null);
            const activeClass = isActive ? 'active-now' : '';
            const buttonHtml = isActive ? 
                `<div class="play-icon-animated"><span></span><span></span><span></span><span></span></div> Слушаю` : 
                `▶ Воспроизвести`;
            return `
                <div class="station-card" data-url="${station.url}" data-name="${station.name.replace(/"/g, '&quot;')}" data-index="${idx}">
                    <div class="card-header">
                        <div class="logo-wrapper"><img src="${station.logo}" alt="" onerror="this.src='https://i.postimg.cc/rmMYcyyJ/radio-placeholder.png'"></div>
                        <div class="station-name">${escapeHtml(station.name)}</div>
                    </div>
                    <div class="genre-tag">${escapeHtml(station.group)}</div>
                    <button class="play-btn ${activeClass}" data-idx="${idx}">${buttonHtml}</button>
                </div>
            `;
        }).join('');
        
        document.querySelectorAll('.play-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const idx = parseInt(btn.dataset.idx);
                if (!isNaN(idx) && idx !== currentIndex) {
                    playByIndex(idx);
                } else if (idx === currentIndex) {
                    togglePlayPause();
                }
            });
        });
        document.querySelectorAll('.station-card').forEach(card => {
            card.addEventListener('click', (e) => {
                if (e.target.classList.contains('play-btn')) return;
                const idx = parseInt(card.dataset.index);
                if (!isNaN(idx)) playByIndex(idx);
            });
        });
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderCategories() {
        const cats = [...new Set(stationsData.map(s => s.group))].sort();
        const nav = document.getElementById('categoriesNav');
        nav.innerHTML = `<button class="cat-btn ${activeCategory === 'ALL' ? 'active' : ''}" data-cat="ALL">📻 ВСЕ</button>` +
            cats.map(c => `<button class="cat-btn ${activeCategory === c ? 'active' : ''}" data-cat="${c}">${escapeHtml(c)}</button>`).join('');
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                activeCategory = btn.dataset.cat;
                renderCategories();
                renderStations();
            });
        });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderStations();
    });

    renderCategories();
    renderStations();
</script>
